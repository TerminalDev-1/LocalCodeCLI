[package]
name = "local_code_core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
dirs = "6.0.0"
futures = "0.3.34"
globwalk = "0.9.1"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
similar = "3.1.2"
sysinfo = "0.39.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "time", "sync", "macros"] }
