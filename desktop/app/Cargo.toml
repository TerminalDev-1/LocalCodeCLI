[package]
name = "local_code_desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
dark-light = "3.0.0"
dirs = "6.0.0"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["tokio", "advanced"] }
local_code_core = { version = "0.1.0", path = "../core" }
once_cell = "1.21.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros"] }
